</style></head><body><header><h1>🧠 Medical Psychology Quiz</h1><p>IGPS 101 · Lectures 1–7 · 40 scenario MCQs</p></header><main id="app"></main><script>
const D=[
["L1","A friend says ‘Stress is bad for you’ and, when challenged, ‘It depends on the individual.’ What is the best evaluation?",["Testable and falsifiable","Not testable: it doesn’t say what should happen, to whom, or under what conditions","Testable because most people agree","Falsifiable because it fits every person"],1,"A testable claim states what should happen, to whom, under what conditions. ‘It depends on the individual’ can never be wrong, so it tells you nothing.",["It can’t be proven wrong.","","Agreement isn’t testability.","A claim that fits every result is not falsifiable."]],
["⚠ L1","Which statement is an observation rather than an inference?",["She is not interested","She looked at her phone twice","She is angry with me","She is exhausted"],1,"An observation is what anyone in the room could check. Interest, anger and exhaustion are inferences you add.",["Inference.","","Inference.","Inference."]],
["L1","A classmate says psychology is ‘the study of feelings’ while the body belongs to medicine. Why is this wrong?",["Psychology is defined by how a claim is tested, not by its subject","Pain and appetite are purely physical","Psychology studies only behavior","Psychology cannot be tested"],0,"Sleep, pain, appetite and fatigue are bodily and psychological at once, so ‘feelings vs body’ doesn’t define psychology.",["","They are bodily and psychological.","Subject matter isn’t the definition.","Testing claims is the defining feature."]],
["L1","A patient has several physical symptoms with no organic cause found. Which statement best explains why doctors need psychology?",["Experience shapes how symptoms are perceived and reported, and at least a third of primary-care physical symptoms have no identifiable organic cause","Psychology replaces diagnosis","Mind and body are independent","Common sense is always right"],0,"Accurate diagnosis and treatment need an understanding of how experience shapes symptoms, adherence and decisions.",["","It supports diagnosis, not replaces it.","That is dualism, the source of the ‘not real medicine’ objection.","Common sense contradicts itself."]],
["L1","‘Too many cooks spoil the broth’ vs ‘Many hands make light work.’ What does this show?",["Common sense can contradict itself, so it must be tested","Proverbs are more reliable than research","Authority settles it","Personal experience is enough"],0,"Psychology tests common sense empirically; common sense contradicts itself and people don’t always act on it.",["","Proverbs aren’t tests.","Authority is not testing.","Experience alone can’t settle contradictions."]],
["L1","Which common-sense belief is supported by research (Box 1.1)?",["Vitamin C prevents colds","Birth order affects personality","Ginger reduces nausea in pregnancy","People with schizophrenia are often violent"],2,"Supported: fruit and vegetables for eye health, ginger for pregnancy nausea, most violence is by men. The other three are not supported.",["Not supported.","Not supported.","","Not supported."]],
["⚠ L2","Which statement is reduction rather than reductionism?",["Depression is nothing but a disturbance of brain chemicals","Changes in brain chemicals are part of what happens in depression","You are no more than a vast assembly of nerve cells","Taking things apart is the only way to learn anything"],1,"‘May be part of’ = reduction (open, legitimate, can be shown wrong). ‘Nothing but’ = reductionism (closed).",["‘Nothing but’ = reductionism.","","Reductionism (ontological).","Reductionism (methodological)."]],
["L2","A student stops coming to class. A physician says anemia, a friend says fear of failing, a brother says their father is sick. What does this case show?",["Only one explanation can be true","All three can be true at once; each predicts something different and none is the whole account","Only the medical explanation counts","Friends’ explanations are invalid"],1,"Explanations at different levels can all be true; each suggests a different action.",["They can co-exist.","","Not the lesson.","Not the lesson."]],
["⚠ L2","A patient stops taking a medicine that gives no immediate reward. Which picture of the human being predicts this as expected rather than as a failure?",["Machine","Atom","Rat (behaviorist)","None, it is always a failure"],2,"Rat: a person is a bundle of learned responses, so behavior without immediate reward fades. It misses choices made against reward and the meaning of an act.",["Machine = disease as a broken part.","Atom = you are your nerve cells.","","It is predicted by the Rat picture."]],
["L2","A blocked artery causes chest pain and a stent restores flow. Which picture explains this best, and what does it miss?",["Machine; it misses why identical X-rays give different pain and the meaning of illness","Rat; it misses habits","Atom; it misses neuroscience","Machine; it misses physiology"],0,"Machine = body as a machine, disease as a broken part. It sees physiology and surgery well but misses meaning and individual differences.",["","Rat explains habits, not this.","Atom is about nerve cells.","The Machine sees physiology well."]],
["⚠ L2","Crick said ‘you are no more than the behavior of a vast assembly of nerve cells.’ Which level of reductionism is this?",["Methodological","Theoretical","Ontological","Statistical"],2,"Ontological = what exists (the higher level is nothing but the lower). Methodological = how to study; theoretical = what explains.",["Methodological is about how we study.","Theoretical is about what explains.","","Not one of the three levels."]],
["L2","Placebo surgery for osteoarthritis improved as much as real surgery. Which feature of the biomedical approach does this challenge?",["Treating psychological processes as separate and incidental","Explaining disease with physiology","Acting on the disease","Using diagnosis"],0,"The biomedical approach is based on dualism, so psychological and social processes are treated as incidental. The placebo effect shows they matter.",["","Physiology isn’t what’s challenged.","Not what’s challenged.","Not what’s challenged."]],
["⚠ L3","In a town the bus route is expensive, so patients miss clinic visits. Which factor is this?",["Pathogenic stimulus","Personal history","External sociocultural environment","Physiological mechanism"],2,"Cost of travel is the external sociocultural environment (access to care). A pathogenic stimulus is an exposure that can cause harm; personal history is internal.",["Not an exposure causing harm.","Personal history is internal.","","Physiology is internal."]],
["⚠ L3","Which comparison is correct?",["Biomedical: circular causality; biopsychosocial: linear","Biomedical: linear causality; biopsychosocial: circular","Biomedical: psychosocial factors essential","Biopsychosocial: responsibility rests only with professionals"],1,"Biomedical = linear (pathogen → person); biopsychosocial = circular, with psychosocial factors essential and responsibility shared with society.",["Columns swapped.","","Biomedical treats them as irrelevant.","Responsibility is shared."]],
["L3","A teenager in a deprived area starts smoking, which strengthens the group norm. Which feature of the model does this show?",["Arrows run both ways: people are changed by their world and change it","Pathogens are the only cause","Causation is linear","Smoking is only personal history"],0,"Circular causality: the environment influences the person and the person influences the environment.",["","Pathogens aren’t the only cause.","Causality is circular here.","Multiple factors interact."]],
["L3","Why is the biopsychosocial model hard to apply to a patient like Anne with hypertension?",["It excludes pathogens","It doesn’t rank the causes; with circular causality you still have to prioritize","It denies cholesterol matters","It ignores lifestyle"],1,"Cholesterol, smoking, obesity, stress and work all act together, and the model doesn’t rank them for you. Pathogens are included as the pathogenic stimulus.",["Pathogens are in the model.","","It includes biological factors.","Lifestyle is included."]],
["L3","Which is an internal factor in the model?",["Poverty","Passive smoking","Adherence to treatment","Access to care"],2,"Internal: personal history, psychosocial processes (lifestyle, personality, mood, symptom perception, adherence), physiological mechanisms. External: poverty, access, exposures, treatment.",["External.","External exposure.","","External."]],
["⚠ L4","David has terminal cancer and skis a hard slope; Karen is depressed and survived an overdose. Which definition classifies BOTH as ill?",["Physical","Behavioral","Cultural norm","Functional"],2,"David is ill physically but healthy by behavioral, functional and psychosocial definitions; Karen is the reverse. Only the cultural norm definition makes both ill.",["Karen is healthy physically.","David is healthy behaviorally.","","David functions well."]],
["⚠ L4","A city funds programs that improve how people feel about their own health, not only disease rates. Which definition underlies this?",["Blaxter’s survey","WHO: complete physical, mental and social wellbeing","Absence of symptoms only","Physical fitness only"],1,"The WHO definition is inclusive, and wellbeing covers how a person feels. Blaxter’s is a survey of how people see health, not a standard.",["A survey, not a standard.","","Too narrow.","Too narrow."]],
["L4","Which is a criticism of the WHO definition?",["It ignores the body","It is not testable","It is too broad and Utopian, confusing happiness with health","It excludes social wellbeing"],2,"Criticisms: too broad to be useful, and a ‘perfect’ state few reach (Saracci: opens the door to limitless treatments). It doesn’t ignore the body and testability isn’t one of the criticisms.",["It includes physical wellbeing.","Not one of the criticisms.","","It includes social wellbeing."]],
["L4","After a long fast a person feels hungry and seeks food. Which concept best explains this drive?",["Homeostasis: balance is lost, so the organism is driven to restore it","Allostatic load","Dualism","Falsifiability"],0,"Homeostasis is a state of physiological equilibrium organisms strive to maintain; drive theories of motivation use it.",["","Strain from repeated stress.","Mind–body separation.","A testing principle."]],
["L4","A 3-year-old is placed in foster care for morbid obesity (New Mexico case). Which is NOT one of the debatable assumptions behind this?",["Obesity is an illness","It is controllable through diet","Parental behavior is the major cause","Her genes alone fully determine her weight"],3,"The four assumptions: obesity is an illness; controllable through diet; parental behavior is the major cause; her physical health matters more than removing her from her family.",["It is one of the four.","It is one of the four.","It is one of the four.",""]],
["L5","During her exam Sara has a racing heart, sweating and a dry mouth while gripping her pen. Which pairing is correct?",["Racing heart: somatic; pen grip: sympathetic","Racing heart: sympathetic (involuntary); pen grip: somatic (voluntary)","Both parasympathetic","Both somatic"],1,"Autonomic (sympathetic) = involuntary organs and glands; somatic = voluntary skeletal muscle movement.",["Reversed.","","Parasympathetic relaxes.","The heart is not somatic."]],
["L5","Which order of events at a synapse is correct?",["Release → electrical signal → binding → response","Electrical signal in the axon → release → crossing the synapse → binding → response","Binding → crossing → release → response","Crossing → release → signal → binding"],1,"Action potential (electrical) down the axon → neurotransmitter release → crossing the synapse → binding receptors → response.",["The electrical signal comes first.","","Binding comes after crossing.","Wrong order."]],
["L5","A patient with Parkinson’s disease is treated with L-Dopa. Which transmitter’s circuit is lost?",["Acetylcholine","Serotonin","Dopamine","GABA"],2,"Dopamine: movement circuit lost in Parkinson’s; it also involves motivation, reward and psychosis. ‘Pleasure chemical’ is an oversimplification.",["Linked to muscle contraction, memory, Alzheimer’s.","Linked to sleep, mood and anxiety.","","The major inhibitory transmitter."]],
["L5","A drug increases GABA activity. What is the expected effect on the receiving neuron?",["More likely to fire","Less likely to fire","No effect","It fires continuously"],1,"GABA is the major inhibitory transmitter; glutamate is excitatory.",["That is excitation.","","It does act.","Not the effect."]],
["L5","After an accident a man can’t form new memories of events, but old ones are intact. Which structure is damaged?",["Cerebellum","Hippocampus","Thalamus","Frontal lobe"],1,"Hippocampus forms new event memories. Cerebellum = coordination; thalamus = sensory relay; frontal = planning.",["Coordination.","","Sensory relay.","Planning and reasoning."]],
["L5","Which statement about the parasympathetic nervous system is correct?",["It prepares for action and raises heart rate","It relaxes: heart rate down, digestion on","It controls voluntary muscles","It releases adrenaline"],1,"Sympathetic prepares for action; parasympathetic relaxes. Voluntary movement is somatic.",["That is sympathetic.","","That is somatic.","That is the SNS/adrenal medulla."]],
["L6","Which statement defines stress?",["The exam itself","The demand is appraised as exceeding your resources to cope","A rise in heart rate","Any physical symptom"],1,"Stressor = the event; stress response = what happens; stress = demand appraised as exceeding resources.",["That is the stressor.","","That is part of the response.","Not a definition."]],
["⚠ L6","Within seconds of a threat, adrenaline is released. Which system is responsible?",["HPA axis","SNS → adrenal medulla","Parasympathetic system","Anterior pituitary alone"],1,"The fast wave is the SNS acting on the adrenal medulla (adrenaline, noradrenaline). The HPA axis is too slow, and the parasympathetic calms.",["Minutes to hours.","","It calms, it doesn’t start the response.","Part of the slow wave."]],
["L6","A student rereads notes, checks answers, asks friends how much they covered and studies until 3 a.m. Why does the exam fear persist?",["Safety behaviors keep the fear alive by stopping it from being tested","These behaviors are effective coping","Allostasis","Bottom-up processing"],0,"Safety behaviors prevent the fear from being tested. ‘Zero anxiety’ is not a good goal (Yerkes–Dodson: moderate arousal is best).",["","They maintain the fear.","Not the concept.","Not the concept."]],
["⚠ L6","Cortisol normally returns to baseline within 40–60 minutes. What is responsible, and what goes wrong in prolonged stress?",["Cortisol tells the hypothalamus to stop CRF (negative feedback); in prolonged stress this brake fails and cortisol stays high","Adrenaline switches cortisol off; prolonged stress removes adrenaline","The parasympathetic system switches it off","Cortisol increases CRF"],0,"Negative feedback is the brake. The problem isn’t the response; it’s a response that doesn’t switch off. Adrenaline does not switch cortisol off.",["","Adrenaline doesn’t switch cortisol off.","Not the mechanism.","That would be positive feedback."]],
["L6","Students often get sick after exams. Why?",["Several days of revision shift immunity from cellular to humoral, and this fades after exams","Short stress always suppresses immunity","Cortisol boosts all immunity","Exams cause infections"],0,"Short stressors give a quick immune boost; several days of stress shift cellular → humoral, which fades afterward. Chronic stress weakens immunity overall.",["","Short stress boosts it.","Cortisol suppresses some immunity.","Not the explanation."]],
["L6","Huda thinks ‘I studied well’ and Noor thinks ‘I will fail’ before the same exam; their cortisol responses differ. Which concept explains this?",["Appraisal (primary and secondary)","Bottom-up processing","Allostasis","Reductionism"],0,"Same stressor, different appraisal, different response (Lazarus & Folkman). Primary = is it a challenge or threat; secondary = do I have resources.",["","Not the concept.","Not the concept.","Not the concept."]],
["⚠ L6","Which best describes allostatic load?",["One strong stress response on a bad day","Strain that builds from repeated or prolonged activation without recovery","Tolerance to stress","Adaptive short-term regulation"],1,"Allostasis is adaptive short-term regulation. Load comes from repetition without recovery, via prolonged response, repeated stressors or inadequate response, not one bad day, and not tolerance.",["Not one bad day.","","It isn’t tolerance.","That is allostasis."]],
["⚠ L7","People miscount the letter F in a sentence because small frequent words like ‘of’ and ‘the’ are processed as single units. What explains this?",["Poor hearing","Top-down processing","Bottom-up processing","Anxiety narrowing attention"],1,"Top-down: what we already know shapes perception. It is not bottom-up and not hearing.",["Not related to hearing.","","Bottom-up starts from the stimulus.","Not the explanation."]],
["⚠ L7","You hear your own name across a noisy room. Which perceptual-set factor is this?",["Emotions","Threshold for perception","Cultural background","Environment (Ames room)"],1,"Hearing your own name = threshold for perception. The seven factors: threshold, past experience, drive state, emotions, values, environment, culture.",["Emotions narrow attention onto threats.","","Faster recognition of own-group faces.","Illusions like the Ames room."]],
["⚠ L7","A nurse with the right plan is distracted and injects air into the bloodstream instead of the feeding tube. Which error is this?",["Mistake","Slip","Violation","Technical error"],1,"Slip (20%): distraction or lapse. Mistake (44%): error in planning. Violation 19%: deliberate breach. Technical error 4%: right plan and technique, action failed.",["Mistake = wrong plan.","","Not deliberate.","The technique was not the problem."]],
["L7","An experienced resident performs a procedure automatically and chats with colleagues. What is the risk of this stage?",["Autonomous stage: mistakes can occur without being noticed","Cognitive stage: needs instruction","Associative stage: steps are still conscious","There is no risk"],0,"Skill stages: cognitive → associative → autonomous. Automatic skills free attention, but errors can happen unnoticed.",["","That stage is early learning.","Not this stage.","Automatic skills carry a risk."]],
["L7","A hospital says hands-free phones make multitasking in theatre safe. What is the best response?",["Safe, because the limit is the hands","Not safe: the limit is attention, not hands","Safe if anxiety is low","Music always improves surgery"],1,"Attention is limited-capacity. Junior doctors did a simulated laparoscopy almost three times better without music. Safety needs systems, not only careful people.",["The limit is attention.","","Anxiety isn’t the issue.","Performance was better without music."]],
["L1","A psychologist studies how attention, perception and memory work. Which specialism is this?",["Clinical","Cognitive","Social","Occupational"],1,"Cognitive = attention, perception, memory. Clinical = disorders and emotions; social = group processes; occupational = work and organisations.",["Disorders and emotions.","","Group processes.","Work and organisations."]],
["L1","Which is NOT one of the four questions to ask of any claim?",["What exactly does it predict?","What would count against it?","Who said it?","What did I actually observe?"],2,"The four: what does it predict, what would count against it, what did I actually observe, what have I added. Who said it is authority, not a test.",["One of the four.","One of the four.","","One of the four."]],
["L1","A patient is told the problem is ‘all in the mind, so not real medicine.’ Which idea does this reflect?",["Dualism (Descartes): mind and body are independent","Holism","The biopsychosocial model","Falsifiability"],0,"Dualism is the source of the ‘not real medicine’ objection. It enabled rapid progress but led to the biomedical model.",["","Holism is the opposite view.","That model links mind and body.","A testing principle."]],
["L2","A patient feels treated as a case rather than met as a person. Which cost of reductionism is this?",["Lost curiosity","Lost humility","Lost range","The patient notices"],3,"Four costs: curiosity (nothing left to ask), humility (a finished explanation can’t be corrected), range (you only see what your picture shows), and the patient notices.",["Curiosity = nothing left to ask.","Humility = can’t be corrected.","Range = limited view.",""]],
["L2","Which group showed that perception is more than the sum of its parts?",["Behaviorists","Gestalt psychologists","Physicalists","Logical positivists"],1,"Gestalt psychologists. Behaviorists suffered ‘physics envy’; Vygotsky proposed analysing units that keep the characteristics of the whole.",["They suffered physics envy.","","They reduce to nerve cells.","They promoted the Unity of Science."]],
["L2","Someone claims social inequalities are genetically fixed and cannot change. What is this called?",["Biological determinism","Holism","Appraisal","Allostasis"],0,"Biological determinism (criticized by Lewontin and Gould). Reducing the social to the individual has political consequences.",["","The opposite of reductionism.","A stress concept.","A stress concept."]],
["L4","Which is NOT one of Blaxter’s six ways of seeing health?",["Not having symptoms of illness","Having physical or social reserves","Healthy lifestyles","Having a high income"],3,"Six ways: no symptoms; physical or social reserves; healthy lifestyles; physically fit or vital; psychological wellbeing; being able to function.",["One of the six.","One of the six.","One of the six.",""]],
["L4","Jenny is a fit 22-year-old with a high-risk BRCA mutation. By which definition is she ill?",["Not vulnerable to disease","Physical fitness","Functional ability","Psychological wellbeing"],0,"She is healthy on most definitions but ill by ‘not vulnerable to disease’ because of her genetic risk. The definition moves, the person doesn’t.",["","She is fit.","She functions well.","Nothing suggests poor wellbeing."]],
["L4","Why does the definition of health matter in practice?",["It decides who is treated and held responsible, and reaches into policy and law","It changes people’s biology","It only matters in research","It has no effect on policy"],0,"Definitions decide who is treated, who is held responsible, and shape policy (fruit for school children, smoking bans).",["","It changes classification, not biology.","It affects policy and law.","It affects policy."]],
["L5","Which part of a neuron carries the electrical signal along its length?",["Dendrites","Axon","Terminal buttons","Synapse"],1,"Dendrites receive; the cell body supports the cell; the axon carries the signal; terminal buttons release chemicals.",["They receive signals.","","They release chemicals.","The gap between cells."]],
["L5","A pinprick sends a signal toward the CNS and a muscle then moves. Which terms fit?",["Afferent (sensory) toward the CNS; efferent (motor) away from it","Efferent toward the CNS; afferent away","Both are afferent","Both are part of the CNS"],0,"Afferent = toward the CNS (sensory); efferent = away from it (motor). Both nerves belong to the PNS.",["","Reversed.","Movement is efferent.","Nerves outside the CNS are PNS."]],
["L5","A stroke damages the occipital lobe. Which function is most affected?",["Hearing","Body sensation","Vision","Planning"],2,"Occipital = vision; temporal = hearing; parietal = body sensation; frontal = planning, reasoning, movement.",["Temporal.","Parietal.","","Frontal."]],
["L5","Neurons that die in Alzheimer’s disease are linked mainly to which transmitter (memory, attention, sleep)?",["Acetylcholine","Dopamine","GABA","Serotonin"],0,"Acetylcholine: voluntary muscle contraction, attention, memory, sleep. Dopamine is lost in Parkinson’s.",["","Parkinson’s and reward.","Inhibitory.","Mood, sleep and anxiety."]],
["L6","A woman cares for a sick relative over several years. Which type of stressor is this?",["Acute","Chronic","Traumatic","Role strain"],1,"Chronic = ongoing, like caring for a relative. Acute = sudden (a death); traumatic = an assault; role strain = balancing home and work roles.",["Acute is sudden.","","Traumatic is an assault.","Role strain is balancing roles."]],
["L6","Under stress, a person seeks out others and oxytocin rises. Which response is this?",["Fight","Flight","Tend and befriend","Freeze only"],2,"Fight–flight is not the only response; tend and befriend involves oxytocin and seeking others.",["Not seeking others.","Not seeking others.","","Not the described response."]],
["L6","A student’s mind goes blank at very high arousal. Which model describes this?",["Inverted U (Yerkes–Dodson): moderate arousal gives the best performance","Linear: more arousal always improves performance","Allostatic load","Primary appraisal"],0,"Too low = bored, careless; middle = alert and focused; too high = blank mind, frozen. ‘Zero anxiety’ is not a good goal.",["","Performance falls at very high arousal.","Not a performance model.","Not a performance model."]],
["L7","You ‘replay’ a sentence you didn’t catch a second ago. Which store allows this?",["Sensory buffer, which holds sounds for a few seconds","Hippocampus long-term storage","Cerebellum","Autonomous skill"],0,"The sensory buffer holds sounds for a few seconds. Attention is also a limited-capacity processor.",["","Not a few-seconds store.","Coordinates movement.","A skill stage."]],
["L7","A doctor who has seen three flu cases hears the next patient’s cough as flu. Which perceptual-set factor?",["Past experience (and expectation)","Cultural background","Threshold for perception","Environment"],0,"Past experience and expectation shape what we perceive. Culture: own-group faces; threshold: own name; environment: Ames room.",["","Own-group faces.","Own name in a noisy room.","Ames room."]],
["L7","A doctor guesses a child’s weight and gives three times the dose. Which error is this?",["Slip","Mistake","Violation","Technical error"],1,"Mistake (44%): the right plan was never made. Slip = distraction; violation = deliberate breach; technical error = right plan and technique, failed action.",["Slip is a lapse with the right plan.","","Not deliberate.","The plan, not the action, was wrong."]],
["L7","In which situation are errors MOST likely?",["The correct response is the strongest, most habitual one","Full attention is on the task","The correct response is not the habitual one, attention is divided, or the person is stressed and anxious","Instructions are being followed step by step"],2,"Errors are most likely when the correct response isn’t the strongest or most habitual, full attention isn’t on the task, or under stress and anxiety.",["Habit favors the correct response.","Full attention reduces errors.","","Not a high-risk situation."]],
["★ L3","A patient’s long journey to the clinic, and the cost of getting there, belong to which part of the model?",["External factors, the sociocultural environment","Internal factors, personal history","Internal factors, psychosocial processes","A pathogenic stimulus"],0,"Access to care and travel cost are the external sociocultural environment. They are not an exposure that causes harm and not something inside the person.",["","Personal history = ethnicity, genes, learned behavior, past illness.","Psychosocial processes = lifestyle, personality, mood, adherence.","A pathogenic stimulus is an exposure that can cause harm."]],
["★ L3","In the smoking story, which shows the person acting on his environment rather than the environment acting on him?",["He is exposed to people who smoke","His smoking reinforces the group norm","The pathogens raise his risk of illness","His vulnerability decides whether he becomes ill"],1,"Arrows run both ways. His smoking strengthening the group norm is the person changing the environment.",["Environment acting on him.","","Pathogens acting on him.","Describes his susceptibility, not his action."]],
["★ L3","In the textbook’s comparison of the two approaches, causality is described as:",["Linear in both approaches","Circular in both approaches","Circular in the biomedical and linear in the biopsychosocial","Linear in the biomedical and circular in the biopsychosocial"],3,"Biomedical = linear (pathogen → person). Biopsychosocial = circular. Distractors often swap the columns.",["Biopsychosocial is circular.","Biomedical is linear.","Columns swapped.",""]],
["★ L3","Why does the textbook say the biopsychosocial model is difficult to apply in practice?",["Psychosocial factors turn out to be irrelevant","Causality is circular, so there is rarely a simple cause and effect","It ignores pathogens","There is no evidence behind it"],1,"Reasons: complexity, circular causality (no simple cause and effect), and the need to prioritize. Pathogens are included.",["They are essential in this model.","","Pathogens are included as the pathogenic stimulus.","The model is widely accepted; the difficulty is practical."]],
["★ L4","David has terminal liver cancer and last week skied the Swiss Wall without stopping. Which statement fits the textbook’s account?",["He is ill by physical definitions and healthy by functional ones","He is healthy by every definition, because he is doing what he wants","He is ill by every definition, because his disease is terminal","His case shows that health is the same as happiness"],0,"David is ill by physical definitions but healthy by behavioral, functional and psychosocial ones. The definition decides who counts as ill.",["","He is ill by physical definitions.","He functions well, so not ill functionally.","Equating health with happiness is Saracci’s criticism of WHO."]],
["★ L4","A health service pays for a treatment because it improves how people feel about their lives, not because it treats a disease. Which definition applies?",["The WHO definition","Blaxter’s six ways of seeing health","Homeostasis","The biomedical approach"],0,"WHO: complete physical, mental and social wellbeing, not merely absence of disease. Blaxter is a survey, not a standard.",["","A survey of how people see health.","A physiological equilibrium concept.","Focuses on disease, not wellbeing."]],
["★ L4","Saracci gives two criticisms of the WHO definition. Which is one of them?",["It is too broad to be useful","It ignores the body","It tries to achieve untestable goals","It is out of date"],0,"The two criticisms: too broad to be useful, and a Utopian ‘perfect’ state few reach even when they feel healthy.",["","It includes physical wellbeing.","Testability is not one of the criticisms.","Not one of the criticisms."]],
["★ L4","Karen is ill by behavioral, functional and psychosocial definitions and healthy by physical ones. What is the most accurate conclusion?",["The definition you use decides who counts as ill","Psychosocial definitions are more accurate than physical ones","A person cannot be healthy and ill at the same time","Physical definitions should be used first and the others afterwards"],0,"The person didn’t change; the definition moved. Definitions decide who is treated and who is held responsible.",["","None is ranked as more accurate.","Karen is exactly that: healthy by some, ill by others.","No such rule is given."]],
["★ L5","A student deliberately moves a pen to write an answer. Which pathway most directly carries the final motor command to the hand muscles?",["Visceral sensory pathway","Somatic motor pathway","Sympathetic motor pathway","Parasympathetic motor pathway"],1,"Somatic = voluntary movement of skeletal muscles. Autonomic (sympathetic/parasympathetic) serves internal organs and glands.",["Sensory, from organs.","","Involuntary, prepares for action.","Involuntary, relaxes."]],

const Q=D.map(x=>({t:x[0],q:x[1],o:x[2],a:x[3],e:x[4],w:x[5]}));
const app=document.getElementById("app");let order=[],pos=0,picked=null,ans={},flags=new Set(),perm={};
try{const s=JSON.parse(localStorage.getItem("bq3")||"{}");flags=new Set(s.fl||[])}catch(e){}
function save(){try{localStorage.setItem("bq3",JSON.stringify({fl:[...flags]}))}catch(e){}}
function sh(a){for(let i=a.length-1;i>0;i--){const j=Math.floor(Math.random()*(i+1));[a[i],a[j]]=[a[j],a[i]]}return a}
function run(list){order=list;pos=0;list.forEach(i=>perm[i]=sh([0,1,2,3]));render()}
function intro(){app.innerHTML=`<div class="card"><h2>Ready?</h2><p>${Q.length} scenario questions. Green = right, red = wrong, with the reason. Flag anything you want to re-check; missed questions come back at the end.</p><div class="col"><button class="pri" id="go">Start quiz</button>${flags.size?`<button class="ghost" id="rf">⚑ Review flagged (${flags.size})</button>`:""}</div></div>`;
document.getElementById("go").onclick=()=>{ans={};run(sh(Q.map((_,i)=>i)))};const r=document.getElementById("rf");if(r)r.onclick=()=>run([...flags])}
function render(){const i=order[pos],q=Q[i];picked=null;
app.innerHTML=`<div class="bar"><i style="width:${pos/order.length*100}%"></i></div><div class="meta"><span>Question ${pos+1} of ${order.length}</span><span class="tag">${q.t}</span></div><div class="card"><p class="q">${q.q}</p>${perm[i].map((k,n)=>`<button class="opt" data-k="${k}"><b>${"ABCD"[n]}</b><span>${q.o[k]}</span></button>`).join("")}<div id="fb"></div></div><div class="row"><button class="ghost" id="fl"></button><button class="pri" id="nx" hidden></button></div>`;
const fl=document.getElementById("fl");const upd=()=>{fl.className="ghost"+(flags.has(i)?" on":"");fl.textContent=flags.has(i)?"⚑ Flagged":"⚐ Flag for review"};upd();
fl.onclick=()=>{flags.has(i)?flags.delete(i):flags.add(i);save();upd()};
app.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k))}
function pick(k){if(picked!==null)return;picked=k;const i=order[pos],q=Q[i],ok=k===q.a;ans[i]=ok;
app.querySelectorAll(".opt").forEach(b=>{b.disabled=true;if(+b.dataset.k===q.a)b.classList.add("ok");else if(+b.dataset.k===k)b.classList.add("no")});
document.getElementById("fb").innerHTML=ok?`<div class="ex ok"><h4>✅ Correct</h4><p>${q.e}</p></div>`:`<div class="ex no"><h4>❌ Not quite. You chose “${q.o[k]}”</h4><p>${q.w[k]}</p></div><div class="ex ok"><h4>✅ Correct: ${q.o[q.a]}</h4><p>${q.e}</p></div>`;
const nx=document.getElementById("nx");nx.hidden=false;nx.textContent=pos===order.length-1?"See results":"Next →";nx.onclick=()=>{pos++;pos>=order.length?done():render()};nx.scrollIntoView({behavior:"smooth",block:"nearest"})}
function done(){const c=order.filter(i=>ans[i]).length,miss=Object.keys(ans).filter(i=>ans[i]===false).map(Number),fl=[...flags];
app.innerHTML=`<div class="card"><div class="big">${c}/${order.length}</div><p style="text-align:center">${miss.length?"Let’s fix the ones you missed 💪":"Perfect round! 🎉"}</p><div class="col">${miss.length?`<button class="pri" id="rm">🔁 Redo missed (${miss.length})</button>`:""}${fl.length?`<button class="ghost" id="rf">⚑ Review flagged (${fl.length})</button>`:""}<button class="ghost" id="rs">Restart everything</button></div></div>`;
const g=id=>document.getElementById(id);if(g("rm"))g("rm").onclick=()=>run(sh(miss));if(g("rf"))g("rf").onclick=()=>run(fl);g("rs").onclick=intro}
intro();
</script></body></html>
